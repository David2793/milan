<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Milán">
<title>Milán</title>
<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#33407a;--mut:#6b7392;--acc:#5b94bf;--line:#e3e8ee;--soft:#e4f0f5;--warn:#fdf1d8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151f;--card:#1b2130;--ink:#e8ecf7;--mut:#9aa3b8;--acc:#7fb3dc;--line:#2a3145;--soft:#243049;--warn:#3a3220}}
:root[data-theme="dark"]{--bg:#11151f;--card:#1b2130;--ink:#e8ecf7;--mut:#9aa3b8;--acc:#7fb3dc;--line:#2a3145;--soft:#243049;--warn:#3a3220}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px 16px 96px;max-width:560px;margin:0 auto}
h1{font:700 36px/1.1 ui-rounded,-apple-system,sans-serif;margin:8px 0 2px}
h2{font-size:17px;margin:18px 0 8px}
.sub{color:var(--mut);margin:0 0 16px;font-size:18px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px}
.mut{color:var(--mut);font-size:14px}
.clock{font:600 60px/1 ui-rounded,-apple-system,sans-serif;font-variant-numeric:tabular-nums;text-align:center;margin:14px 0}
.row{display:flex;gap:10px;align-items:center}.c{justify-content:center}.sp{justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--ink);padding:9px 4px;border-radius:10px;font:inherit;font-size:15px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px #0002;font-weight:600}
.seg.dis{opacity:.5;pointer-events:none}
.btn{border:0;background:var(--acc);color:#fff;border-radius:14px;padding:12px 18px;font:inherit;font-weight:600;width:100%}
.btn.ghost{background:var(--soft);color:var(--ink)}
.round{width:76px;height:76px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:30px}
.round.s{width:52px;height:52px;font-size:20px;background:var(--soft);color:var(--ink)}.round.g{background:#34a853;color:#fff}
.tile{text-align:left;border:0;width:100%;background:var(--card);color:var(--ink);border-radius:20px;padding:14px;font:inherit}
.tile b{display:block;font-size:19px;margin:2px 0}.tile span{font-size:13px;color:var(--mut)}
.alert{background:var(--warn);border-radius:14px;padding:10px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
.mini{border:0;background:var(--acc);color:#fff;border-radius:10px;padding:6px 12px;font:inherit}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.item .t{flex:1}.x{border:0;background:none;color:var(--mut);font-size:18px}
.chk{width:24px;height:24px;margin:0;flex:none;accent-color:var(--acc)}
.chips{display:flex;gap:8px;margin-bottom:10px}.chips button{flex:1;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px;font:inherit}.chips button.on{border-color:var(--acc);background:var(--soft)}
pre{white-space:pre-wrap;font:13px/1.4 ui-monospace,monospace;background:var(--bg);border-radius:12px;padding:12px;margin:0 0 10px}
nav{position:fixed;left:0;right:0;bottom:0;top:auto;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px}
nav button span{font-size:22px}nav button.on{color:var(--acc);font-weight:600}
.done{text-decoration:line-through;color:var(--mut)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:14px;padding:12px;text-align:center;font-size:14px;z-index:30}
.sheet{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
</style>
<link rel="icon" href="apple-touch-icon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
(function(){let res;const ready=new Promise(r=>res=r);window.__res=res;
window.claude={use:n=>Promise.race([ready.then(x=>(x&&x[n])||null),new Promise(r=>setTimeout(()=>r(null),8000))])}})();
</script>
</head>

const VAX=[["BCG","Al nacer"],["Hepatitis B","Al nacer"],["Hexavalente (1ª dosis)","2 meses"],["Neumococo (1ª dosis)","2 meses"],["Rotavirus (1ª dosis)","2 meses"],["Hexavalente (2ª dosis)","4 meses"],["Neumococo (2ª dosis)","4 meses"],["Rotavirus (2ª dosis)","4 meses"]];
const def=()=>({feeds:[],diapers:[],sleeps:[],growth:[],notes:[],memos:[],vax:VAX.map(([n,age])=>({n,age,done:false})),
 timer:{side:"L",acc:0,at:null,start:null},cfg:{every:3,d3on:false,d3:"09:00",appt:"",apptNote:""},seen:{}});
let S;try{S=Object.assign(def(),JSON.parse(localStorage.getItem(K)||"{}"))}catch(e){S=def()}
const LOCAL=JSON.parse(JSON.stringify(S));
let DB=null,SYNC='wait',pend=false;
const save=()=>{if(!DB)try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.hidden=false;setTimeout(()=>t.hidden=true,3500)};
const wr=p=>p.catch(e=>toast(e&&e.code==='invalid_argument'?'No tienes permiso para editar':'No se pudo sincronizar'));
const put=(c,r)=>{const a=S[c],i=a.findIndex(x=>x.id===r.id);if(i<0)a.push(r);else a[i]=r;if(DB){const{id,...d}=r;wr(DB.doc(c+'/'+id).set(d))}};
const rm=(c,id)=>{S[c]=S[c].filter(x=>String(x.id)!==String(id));if(DB)wr(DB.doc(c+'/'+id).delete())};
const setT=t=>{S.timer=t;if(DB)wr(DB.doc('meta/timer').set(t))};
const setCfg=()=>{if(DB)wr(DB.doc('meta/cfg').set(S.cfg))};
const setSeen=()=>{if(DB)wr(DB.doc('meta/seen').set(S.seen))};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const desc=(a,k)=>[...a].sort((x,y)=>y[k]-x[k]);
const pad=n=>String(n).padStart(2,"0");
const clock=t=>{t=Math.max(0,Math.floor(t));const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return(h?h+":":"")+pad(m)+":"+pad(s)};
const spoken=t=>{const m=Math.round(t/60),h=Math.floor(m/60);return h?h+" h"+(m%60?" "+m%60+" min":""):m+" min"};
const rel=ts=>{const s=(Date.now()-ts)/1000;if(s<60)return"hace un momento";if(s<3600)return"hace "+Math.floor(s/60)+" min";if(s<86400){const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return"hace "+h+" h"+(m?" "+m+" min":"")}return"hace "+Math.floor(s/86400)+" d"};
const hm=ts=>new Date(ts).toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"});
const fdt=ts=>new Date(ts).toLocaleString("es",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const loc=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())};
const isToday=ts=>new Date(ts).toDateString()===new Date().toDateString();
const sod=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const greet=()=>{const h=new Date().getHours();return h>=5&&h<12?"Buenos días ☀️":h<20?"Buenas tardes 🌤️":"Buenas noches 🌙"};
const DK={pee:["💧","Pipí"],poop:["💩","Popó"],both:["💧💩","Ambos"]};
const feedTxt=f=>f.kind==="breast"?"Pecho "+(f.side==="L"?"izq.":"der.")+" · "+spoken(f.dur):"Biberón · "+f.ml+" ml";

// ---- estado de UI
let T=localStorage.getItem('milan:fam')?"home":"rem",RS="feed",RK="breast",RSIDE="L",DKS="pee",QD=false;

// ---- cronómetro (persistente)
const el=()=>{const t=S.timer;return t.acc+(t.at?(Date.now()-t.at)/1000:0)};
const tPause=()=>{const t=S.timer;if(t.at){t.acc=el();t.at=null}};
const tReset=()=>{S.timer={side:S.timer.side,acc:0,at:null,start:null}};
const sleepToday=()=>S.sleeps.reduce((a,s)=>a+Math.max(0,Math.min(s.e||Date.now(),Date.now())-Math.max(s.s,sod())),0)/1000;

function alerts(){const o=[],now=Date.now(),c=S.cfg,lf=desc(S.feeds,"t")[0];
 if(lf){const nx=lf.t+c.every*36e5;o.push(now>=nx?"🍼 Ya pasaron "+c.every+" h desde la última toma":"🍼 Próxima toma hacia las "+hm(nx))}
 if(c.d3on){const[h,m]=c.d3.split(":").map(Number),d=new Date();d.setHours(h,m,0,0);if(now>=d.getTime()&&!S.seen[loc(now).slice(0,10)])o.push("<span>💊 Vitamina D3 de hoy</span><button class=mini data-a=d3done>Hecho</button>")}
 if(c.appt){const t=new Date(c.appt).getTime();if(t>now&&t-now<864e5)o.push("📅 Cita médica"+(c.apptNote?" · "+esc(c.apptNote):"")+" — "+fdt(t))}
 return o.map(x=>'<div class="alert">'+x+"</div>").join("")}

function home(){const t=S.timer,sess=t.start!=null,lb=desc(S.feeds.filter(f=>f.kind==="breast"),"t")[0],lf=desc(S.feeds,"t")[0],ld=desc(S.diapers,"t")[0],os=S.sleeps.find(s=>!s.e);
 return`<div class="row" style="margin:8px 0 16px"><img src="${LOGO}" alt="" width="56" height="56" style="border-radius:14px"><div><h1 style="margin:0">Milán</h1><p class="sub" style="margin:0">${greet()}</p></div></div>${alerts()}
 <div class="card"><b>❤️ Lactancia</b>
 <div class="seg ${sess?"dis":""}" style="margin-top:12px"><button data-a="side" data-v="L" class="${t.side==="L"?"on":""}">Izquierdo</button><button data-a="side" data-v="R" class="${t.side==="R"?"on":""}">Derecho</button></div>
 <div class="clock" id="clk">${clock(el())}</div>
 <div class="row c" style="gap:22px">${sess?'<button class="round s" data-a="treset" aria-label="Descartar">✕</button>':""}
 <button class="round" data-a="tgo" aria-label="${t.at?"Pausar":"Iniciar"}">${t.at?"❚❚":"▶"}</button>
 ${sess?'<button class="round s g" data-a="tsave" aria-label="Guardar toma">✓</button>':""}</div>
 <p class="mut" style="margin:16px 0 0">🕘 ${lb?"Última: "+feedTxt(lb)+" · "+rel(lb.t):"Aún no hay tomas registradas"}</p></div>
 <h2>Resumen de hoy</h2><div class="grid">
 <div class="tile"><span>🍼 Última toma</span><b>${lf?rel(lf.t):"—"}</b><span>${lf?feedTxt(lf):"Sin registros"}</span></div>
 <button class="tile" data-a="qd"><span>🧷 Último pañal ＋</span><b>${ld?rel(ld.t):"—"}</b><span>${ld?DK[ld.kind].join(" "):"Toca para registrar"}</span></button></div>
 ${QD?'<div class="card" style="margin-top:12px"><div class="chips" style="margin:0">'+Object.entries(DK).map(([k,v])=>`<button data-a="dq" data-v="${k}">${v[0]}<br>${v[1]}</button>`).join("")+"</div></div>":""}
 <button class="tile" data-a="sleept" style="margin-top:12px"><span>${os?"🌙 Durmiendo ■":"😴 Sueño de hoy ▶"}</span><b>${spoken(sleepToday())}</b><span>${os?"Durmiendo desde las "+hm(os.s)+" · toca para terminar":"Toca para iniciar siesta"}</span></button>`}

function log(){const sub=`<div class="seg">${[["feed","🍼 Comida"],["diaper","🧷 Pañal"],["sleep","😴 Sueño"]].map(([k,l])=>`<button data-a="rs" data-v="${k}" class="${RS===k?"on":""}">${l}</button>`).join("")}</div>`;
 let f="";
 if(RS==="feed")f=`<div class="chips"><button data-a="rk" data-v="breast" class="${RK==="breast"?"on":""}">Lactancia</button><button data-a="rk" data-v="bottle" class="${RK==="bottle"?"on":""}">Biberón</button></div>
 ${RK==="breast"?`<div class="chips"><button data-a="rsd" data-v="L" class="${RSIDE==="L"?"on":""}">Izquierdo</button><button data-a="rsd" data-v="R" class="${RSIDE==="R"?"on":""}">Derecho</button></div><label>Duración (minutos)</label><input id="f-min" type="number" inputmode="numeric" min="1" value="10">`:`<label>Cantidad (ml)</label><input id="f-ml" type="number" inputmode="numeric" min="1" value="90">`}
 <label>Cuándo</label><input id="f-when" type="datetime-local" value="${loc(Date.now())}"><button class="btn" data-a="fsave">Guardar</button>`;
 if(RS==="diaper")f=`<div class="chips">${Object.entries(DK).map(([k,v])=>`<button data-a="dks" data-v="${k}" class="${DKS===k?"on":""}">${v[0]}<br>${v[1]}</button>`).join("")}</div>
 <label>Color o consistencia (opcional)</label><input id="d-note" placeholder="ej. amarillo, blando"><label>Cuándo</label><input id="d-when" type="datetime-local" value="${loc(Date.now())}"><button class="btn" data-a="dsave">Guardar</button>`;
 if(RS==="sleep")f=`<label>Inicio</label><input id="s-a" type="datetime-local" value="${loc(Date.now()-18e5)}"><label>Fin</label><input id="s-b" type="datetime-local" value="${loc(Date.now())}"><button class="btn" data-a="ssave">Guardar siesta</button>`;
 const items=[...S.feeds.filter(x=>isToday(x.t)).map(x=>({t:x.t,i:"🍼",x:feedTxt(x),ty:"feeds",id:x.id})),
 ...S.diapers.filter(x=>isToday(x.t)).map(x=>({t:x.t,i:"🧷",x:DK[x.kind].join(" ")+(x.note?" · "+esc(x.note):""),ty:"diapers",id:x.id})),
 ...S.sleeps.filter(x=>isToday(x.s)||!x.e).map(x=>({t:x.s,i:"😴",x:"Sueño "+(x.e?spoken((x.e-x.s)/1000):"(en curso)")+(x.e?" · hasta "+hm(x.e):""),ty:"sleeps",id:x.id}))];
 return`<h1>Registro</h1><p class="sub">Hoy</p>${sub}<div class="card">${f}</div><h2>Línea de tiempo de hoy</h2><div class="card">${items.length?desc(items,"t").map(i=>`<div class="item"><span>${i.i}</span><div class="t">${i.x}<div class="mut">${hm(i.t)}</div></div><button class='x' data-a='edit' data-ty='${i.ty}' data-id='${i.id}' aria-label='Editar'>✏️</button><button class="x" data-a="del" data-ty="${i.ty}" data-id="${i.id}" aria-label="Borrar">🗑</button></div>`).join(""):'<span class="mut">Aún no hay registros hoy.</span>'}</div>`}

function report(){const d=Date.now()-864e5,fs=S.feeds.filter(x=>x.t>d),dp=S.diapers.filter(x=>x.t>d),c=k=>dp.filter(x=>x.kind===k).length,
 sl=S.sleeps.reduce((a,s)=>a+Math.max(0,Math.min(s.e||Date.now(),Date.now())-Math.max(s.s,d)),0)/1000,g=desc(S.growth,"t")[0],
 pn=S.notes.filter(n=>!n.done),vd=S.vax.filter(v=>v.done).length;
 return["📋 Resumen de Milán — "+new Date().toLocaleDateString("es"),"","Últimas 24 h:",
