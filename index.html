<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Milán">
<title>Milán</title>
<style>
:root{--bg:#F7F8FA;--card:#FFFFFF;--ink:#344A82;--mut:#78839D;--acc:#344A82;--btn:#344A82;--line:#E6EAF0;--soft:#E8F1F7;--warn:#F9EACB;--ok:#83B8A5;--bad:#D9777A;--sh:0 2px 12px rgba(52,74,130,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1526;--card:#172138;--ink:#E6ECFA;--mut:#93A0BD;--acc:#8FB0EA;--btn:#4C6CB8;--line:#26324D;--soft:#22304D;--warn:#3A3322;--ok:#6FA391;--bad:#E08A8D;--sh:0 2px 12px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0E1526;--card:#172138;--ink:#E6ECFA;--mut:#93A0BD;--acc:#8FB0EA;--btn:#4C6CB8;--line:#26324D;--soft:#22304D;--warn:#3A3322;--ok:#6FA391;--bad:#E08A8D;--sh:0 2px 12px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px 16px 96px;max-width:560px;margin:0 auto}
h1{font:700 36px/1.1 ui-rounded,-apple-system,sans-serif;margin:8px 0 2px}
h2{font-size:17px;margin:18px 0 8px}
.sub{color:var(--mut);margin:0 0 16px;font-size:18px}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.mut{color:var(--mut);font-size:14px}
.clock{font:600 60px/1 ui-rounded,-apple-system,sans-serif;font-variant-numeric:tabular-nums;text-align:center;margin:14px 0}
.row{display:flex;gap:10px;align-items:center}.c{justify-content:center}.sp{justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--ink);padding:9px 4px;border-radius:10px;font:inherit;font-size:15px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px #0002;font-weight:600}
.seg.dis{opacity:.5;pointer-events:none}
.btn{border:0;background:var(--btn);color:#fff;border-radius:16px;padding:14px 18px;min-height:52px;font:inherit;font-weight:600;width:100%;transition:transform .12s,opacity .2s}.btn:active,.round:active,.tile:active{transform:scale(.97)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.round{width:76px;height:76px;border-radius:50%;border:0;background:var(--btn);color:#fff;font-size:30px}
.round.s{width:52px;height:52px;font-size:20px;background:var(--soft);color:var(--ink)}.round.g{background:var(--ok);color:#fff}
.tile{text-align:left;border:0;width:100%;background:var(--card);color:var(--ink);border-radius:22px;padding:14px;font:inherit;box-shadow:var(--sh)}
.tile b{display:block;font-size:19px;margin:2px 0}.tile span{font-size:13px;color:var(--mut)}
.alert{background:var(--warn);border-radius:14px;padding:10px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
.mini{border:0;background:var(--btn);color:#fff;border-radius:10px;padding:6px 12px;font:inherit}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.item .t{flex:1}.x{border:0;background:none;color:var(--mut);font-size:18px}
.chk{width:24px;height:24px;margin:0;flex:none;accent-color:var(--acc)}
.chips{display:flex;gap:8px;margin-bottom:10px}.chips button{flex:1;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px;font:inherit}.chips button.on{border-color:var(--acc);background:var(--soft)}
pre{white-space:pre-wrap;font:13px/1.4 ui-monospace,monospace;background:var(--bg);border-radius:12px;padding:12px;margin:0 0 10px}
nav{position:fixed;left:0;right:0;bottom:0;top:auto;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px}
nav button span{display:grid;place-items:center;width:44px;height:30px;border-radius:16px;transition:background .2s}nav button.on span{background:var(--soft)}
#app.fx{animation:fin .25s ease}@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){#app.fx{animation:none}}nav button.on{color:var(--acc);font-weight:600}
.done{text-decoration:line-through;color:var(--mut)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:14px;padding:12px;text-align:center;font-size:14px;z-index:30}
.sheet{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.tl{position:relative;padding-left:34px}.tl:before{content:'';position:absolute;left:13px;top:0;bottom:0;width:2px;background:var(--line)}.tli{position:relative;margin-bottom:12px}.dot{position:absolute;left:-34px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--sh);font-size:14px}.tlc{display:block;width:100%;text-align:left;border:0;background:var(--card);color:var(--ink);border-radius:20px;padding:12px;font:inherit;box-shadow:var(--sh)}.tlc img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:14px;margin-bottom:8px}.mh{font-weight:700;text-transform:capitalize;margin:14px 0 8px}.tl .mh{margin-left:-34px;padding-left:34px}.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}@media (max-width:360px){.gal{grid-template-columns:repeat(2,1fr)}}.ph{position:relative;border:0;padding:0;border-radius:14px;overflow:hidden;aspect-ratio:1;background:var(--soft)}.ph img{width:100%;height:100%;object-fit:cover;display:block}.ph span{position:absolute;left:6px;bottom:4px;font-size:10px;color:#fff;text-shadow:0 1px 3px #0009}.vw{position:fixed;inset:0;background:#000;z-index:25;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}.vz{flex:1;overflow:auto;display:grid;place-items:center;min-height:0}
.x svg{width:20px;height:20px;vertical-align:middle}.seg button svg{width:18px;height:18px;vertical-align:-4px;margin-right:2px}.alert svg,.mini svg{width:16px;height:16px;vertical-align:-3px}.round svg{width:30px;height:30px}.round.s svg{width:22px;height:22px}.tile>span svg{width:18px;height:18px;vertical-align:-4px}b>svg{width:20px;height:20px;vertical-align:-4px;margin-right:2px}.chips svg{width:22px;height:22px}.ic svg{width:22px;height:22px;vertical-align:middle}.mv{position:absolute;right:6px;top:8px;display:flex;flex-direction:column;background:var(--bg);border-radius:12px}.mv .x{padding:6px 8px}.vw .mini svg{width:20px;height:20px}
</style>
<link rel="icon" href="apple-touch-icon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
(function(){let res;const ready=new Promise(r=>res=r);window.__res=res;
window.claude={use:n=>Promise.race([ready.then(x=>(x&&x[n])||null),new Promise(r=>setTimeout(()=>r(null),8000))])}})();
</script>

const def=()=>({feeds:[],diapers:[],sleeps:[],growth:[],notes:[],memos:[],moments:[],photos:[],visits:[],profile:{name:'Milán',birth:'',photo:''},vax:VAX.map(([n,age])=>({n,age,done:false})),
 timer:{side:"L",acc:0,at:null,start:null},cfg:{every:3,d3on:false,d3:"09:00",appt:"",apptNote:""},seen:{}});
let S;try{S=Object.assign(def(),JSON.parse(localStorage.getItem(K)||"{}"))}catch(e){S=def()}
const LOCAL=JSON.parse(JSON.stringify(S));
let DB=null,SYNC='wait',pend=false;
const save=()=>{if(!DB)try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.hidden=false;setTimeout(()=>t.hidden=true,3500)};
const wr=p=>p.catch(e=>toast(e&&e.code==='invalid_argument'?'No tienes permiso para editar':'No se pudo sincronizar'));
const put=(c,r)=>{const a=S[c],i=a.findIndex(x=>x.id===r.id);if(i<0)a.push(r);else a[i]=r;if(DB){const{id,...d}=r;wr(DB.doc(c+'/'+id).set(d))}};
const rm=(c,id)=>{S[c]=S[c].filter(x=>String(x.id)!==String(id));if(DB)wr(DB.doc(c+'/'+id).delete())};
const setT=t=>{S.timer=t;if(DB)wr(DB.doc('meta/timer').set(t))};
const setCfg=()=>{if(DB)wr(DB.doc('meta/cfg').set(S.cfg))};
const setSeen=()=>{if(DB)wr(DB.doc('meta/seen').set(S.seen))};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const desc=(a,k)=>[...a].sort((x,y)=>y[k]-x[k]);
const pad=n=>String(n).padStart(2,"0");
const clock=t=>{t=Math.max(0,Math.floor(t));const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return(h?h+":":"")+pad(m)+":"+pad(s)};
const spoken=t=>{const m=Math.round(t/60),h=Math.floor(m/60);return h?h+" h"+(m%60?" "+m%60+" min":""):m+" min"};
const rel=ts=>{const s=(Date.now()-ts)/1000;if(s<60)return"hace un momento";if(s<3600)return"hace "+Math.floor(s/60)+" min";if(s<86400){const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return"hace "+h+" h"+(m?" "+m+" min":"")}return"hace "+Math.floor(s/86400)+" d"};
const hm=ts=>new Date(ts).toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"});
const fdt=ts=>new Date(ts).toLocaleString("es",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const loc=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())};
const isToday=ts=>new Date(ts).toDateString()===new Date().toDateString();
const sod=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const greet=()=>{const h=new Date().getHours();return h>=5&&h<12?"Buenos días ☀️":h<20?"Buenas tardes 🌤️":"Buenas noches 🌙"};
const DK={pee:["💧","Pipí"],poop:["💩","Popó"],both:["💧💩","Ambos"]};
const feedTxt=f=>f.kind==="breast"?(f.side==="B"?"Ambos pechos · izq. "+spoken(f.dL||0)+" · der. "+spoken(f.dR||0):"Pecho "+(f.side==="L"?"izq.":"der.")+" · "+spoken(f.dur)):"Biberón · "+f.ml+" ml";

const tPause=()=>{const t=S.timer;if(t.at){t.acc=el();t.at=null}};
const tReset=()=>{S.timer={side:S.timer.side,acc:0,at:null,start:null}};
const sleepToday=()=>S.sleeps.reduce((a,s)=>a+Math.max(0,Math.min(s.e||Date.now(),Date.now())-Math.max(s.s,sod())),0)/1000;

function alerts(){const o=[],now=Date.now(),c=S.cfg,lf=desc(S.feeds,"t")[0];
 if(c.d3on){const[h,m]=c.d3.split(":").map(Number),d=new Date();d.setHours(h,m,0,0);if(now>=d.getTime()&&!S.seen[loc(now).slice(0,10)])o.push("<span>"+ico("pill")+" Vitamina D3 de hoy</span><button class=mini data-a=d3done>Hecho</button>")}
 S.visits.filter(v=>v.next>now&&v.next-now<864e5).forEach(v=>o.push(ico('calendar')+' Consulta'+(v.doc?' con '+esc(v.doc):'')+' — '+fdt(v.next)));
 (c.rems||[]).filter(r=>r.on).forEach(r=>{const[h,m]=r.time.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);const k=loc(now).slice(0,10)+r.id;if(now>=d.getTime()&&!S.seen[k])o.push('<span>'+ico('bell')+' '+esc(r.title)+'</span><button class=mini data-a=remdone data-k='+k+'>Hecho</button>')});
 if(c.appt){const t=new Date(c.appt).getTime();if(t>now&&t-now<864e5)o.push(ico("calendar")+" Cita médica"+(c.apptNote?" · "+esc(c.apptNote):"")+" — "+fdt(t))}
 return o.map(x=>'<div class="alert">'+x+"</div>").join("")}

let PROF=false;
const saveProf=()=>{if(DB)wr(DB.doc('meta/profile').set(S.profile));else save()};
const avatar=n=>S.profile.photo?`<img src="${S.profile.photo}" width="${n}" height="${n}" alt="" style="border-radius:50%;object-fit:cover;display:block">`:`<div style="width:${n}px;height:${n}px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;color:var(--ink);font-size:${Math.round(n*.45)}px">${esc((S.profile.name||'M')[0].toUpperCase())}</div>`;

      doc:p=>({set:d=>F.setDoc(F.doc(fs,base+p),d),delete:()=>F.deleteDoc(F.doc(fs,base+p)),get:async()=>{const x=await F.getDoc(F.doc(fs,base+p));return{exists:x.exists(),data:()=>x.data()}},
        onSnapshot:(n,e)=>F.onSnapshot(F.doc(fs,base+p),s=>n({exists:s.exists(),data:()=>s.data()}),e)}),
      collection:p=>({onSnapshot:(n,e)=>F.onSnapshot(F.collection(fs,base+p),s=>n({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}),e)})
    };
    window.__res({db,user:{can:async()=>true}});
  }else window.__res(null);
}catch(e){console.error(e);window.__res(null)}
</script>
</body>
</html>
